version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      fonts:
        patterns:
          - "@fontsource/*"
          - "@fontsource-variable/*"
      testing:
        patterns:
          - "@playwright/test"
          - "@axe-core/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
