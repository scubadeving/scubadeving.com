version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      fonts:
        patterns:
          - "@fontsource/*"
          - "@fontsource-variable/*"
      testing:
        patterns:
          - "@playwright/test"
          - "@axe-core/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
