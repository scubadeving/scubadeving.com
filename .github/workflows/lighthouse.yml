name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: python3 -m http.server 4321 --directory dist &
      - run: npx wait-on http://localhost:4321 --timeout 15000
      - name: Run Lighthouse CI
        run: npx @lhci/cli@latest autorun
